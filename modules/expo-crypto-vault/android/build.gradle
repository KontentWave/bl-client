plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cryptovault'
version = '1.0.0'

android {
  namespace 'expo.modules.cryptovault'
  defaultConfig {
    minSdkVersion 24
  }
}

dependencies {
  implementation project(':expo-modules-core')
}